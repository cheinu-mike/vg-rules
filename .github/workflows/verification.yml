name: Extension verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'vg_rules/**'
      - 'tests/**'
      - 'build_*.py'
      - '.gitattributes'
      - '.github/workflows/**'
      - 'submission/gui-results.json'
  pull_request:
    paths:
      - 'vg_rules/**'
      - 'tests/**'
      - 'build_*.py'
      - '.gitattributes'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download official Blender 4.2.23
        run: python tests/download_blender.py --version 4.2.23 --directory "${{ runner.temp }}/blender"
      - name: Packaging regressions and final installers
        shell: pwsh
        run: |
          $env:VGR_TEST_BLENDER = $env:VGR_BLENDER
          python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B build_addon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B build_extension.py --blender "$env:VGR_BLENDER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-installers
          path: dist/
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        version: ['4.2.0', '4.2.23', '5.2.0']
        target:
          - {runner: windows-2022, platform: windows-x64}
          - {runner: ubuntu-22.04, platform: linux-x64}
          - {runner: macos-15-intel, platform: macos-x64}
          - {runner: macos-15, platform: macos-arm64}
        exclude:
          # The user accepted Intel coverage on both 4.2 versions. No official
          # 5.2.0 Intel distribution exists; do not emulate or silently substitute.
          - version: '5.2.0'
            target: {runner: macos-15-intel, platform: macos-x64}
    name: '${{ matrix.target.platform }} / Blender ${{ matrix.version }}'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-installers
          path: dist/
      - name: Download pinned official Blender
        run: python tests/download_blender.py --version ${{ matrix.version }} --directory "${{ runner.temp }}/blender"
      - name: Shared source, installed ZIP and restart lifecycle
        shell: bash
        run: python -B tests/run_blender.py --blender "$VGR_BLENDER" --expect-version "${{ matrix.version }}" --output-dir "${{ runner.temp }}/evidence"
      - name: Preserve actual results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'verification-${{ matrix.target.platform }}-${{ matrix.version }}'
          path: '${{ runner.temp }}/evidence/'
          if-no-files-found: warn
          retention-days: 30
  release-gate:
    if: always()
    needs: [package, verify]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: candidate-installers
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: verification-*
          path: '${{ runner.temp }}/evidence/'
      - name: Report missing or failed checks as release blockers
        run: python -B tests/compliance.py --evidence "${{ runner.temp }}/evidence" --output "${{ runner.temp }}/compliance" --require-ready
      - name: Preserve compliance report even when blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compliance-report
          path: '${{ runner.temp }}/compliance/'
          if-no-files-found: warn
          retention-days: 30
